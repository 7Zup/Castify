<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Castify – README hero image</title>
<!-- Rendered to docs/images/castify-overview.png (1200x560 CSS px at 2x). Uses the two
     placeholder screens: docs/images/phone-home.png and docs/images/tv-welcome.png. -->
<style>
  * { box-sizing:border-box; }
  body { margin:0; width:1200px; height:560px; background:#0b0b0b; font-family:Roboto, system-ui, -apple-system, sans-serif; color:#fff;
         display:flex; align-items:flex-end; justify-content:center; gap:36px; padding-bottom:40px; }
  figure { margin:0; display:flex; flex-direction:column; align-items:center; }
  figcaption { text-align:center; margin-top:18px; font-size:20px; font-weight:800; }
  figcaption span { display:block; margin-top:4px; font-size:14px; font-weight:400; color:#B3B3B3; text-align:center; }
  .phone { width:216px; height:444px; border:8px solid #2b2b2b; border-radius:30px; overflow:hidden; background:#141414; }
  .phone img { width:100%; display:block; }
  .tv { width:640px; height:360px; border:10px solid #2b2b2b; border-radius:8px; overflow:hidden; background:#000; }
  .tv img { width:100%; display:block; }
  .stand { width:140px; height:10px; background:#2b2b2b; border-radius:0 0 6px 6px; }
  .arrow { align-self:center; display:flex; flex-direction:column; align-items:center; color:#E50914; margin-top:-40px; }
  .arrow svg.cast { width:40px; height:40px; fill:#fff; }
  .arrow .line { display:flex; align-items:center; margin-top:10px; }
  .arrow .line i { display:block; width:110px; height:4px; background:#E50914; border-radius:2px; }
  .arrow .line b { width:0; height:0; border-top:11px solid transparent; border-bottom:11px solid transparent; border-left:18px solid #E50914; }
  .arrow p { margin:10px 0 0; font-size:14px; color:#B3B3B3; text-align:center; line-height:1.35; }
</style>
</head>
<body>
  <figure>
    <div class="phone"><img src="../images/phone-home.png" alt=""></div>
    <figcaption>Castify<span>on your phone</span></figcaption>
  </figure>

  <div class="arrow">
    <svg class="cast" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11z"/></svg>
    <div class="line"><i></i><b></b></div>
    <p>sends the video<br>over Wi-Fi</p>
  </div>

  <figure>
    <div class="tv"><img src="../images/tv-welcome.png" alt=""></div>
    <div class="stand"></div>
    <figcaption>Castify TV<span>on your Chromecast with Google TV</span></figcaption>
  </figure>
</body>
</html>
