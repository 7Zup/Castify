<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Castify – README image: TV welcome screen</title>
<!-- Rendered to docs/images/tv-welcome.png (960x540 CSS px = TV dp, at 2x). Same layout as
     TvScreen.Waiting (Connected state). Placeholder TV name only. -->
<style>
  :root { --bg:#141414; --panel:#0B0B0B; --surface:#1F1F1F; --red:#E50914; --text:#FFFFFF; --text2:#B3B3B3; --dis:#6D6D6D; --ready:#46D369; }
  * { box-sizing:border-box; }
  body { margin:0; width:960px; height:540px; background:var(--bg); color:var(--text); font-family:Roboto, system-ui, -apple-system, sans-serif; display:flex; position:relative; overflow:hidden; }
  .l { width:410px; height:100%; background:var(--panel); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .title { font-size:32px; font-weight:900; margin-top:16px; }
  .pill { margin-top:20px; background:var(--surface); border-radius:40px; padding:10px 22px; display:flex; align-items:center; font-size:16px; font-weight:700; }
  .pill .dot { width:10px; height:10px; border-radius:50%; background:var(--ready); margin-right:12px; }
  .pill .st { color:var(--text2); font-weight:400; font-size:14px; margin-left:24px; }
  .r { flex:1; padding:0 48px 0 70px; display:flex; flex-direction:column; justify-content:center; }
  h2 { margin:0; font-size:24px; font-weight:900; }
  .step { display:flex; align-items:center; margin-top:32px; }
  .step:first-of-type { margin-top:40px; }
  .num { width:36px; height:36px; border-radius:50%; background:var(--red); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:900; flex:0 0 auto; }
  .num.ok { background:var(--ready); color:#000; }
  .txt { margin-left:20px; font-size:18px; font-weight:700; }
  .txt.done { color:var(--text2); }
  .txt small { display:block; font-size:15px; font-weight:400; color:var(--text2); margin-top:2px; }
  .ver { position:absolute; right:28px; bottom:20px; font-size:13px; color:var(--dis); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="cgrad" gradientUnits="userSpaceOnUse" x1="32" y1="54" x2="68" y2="54"><stop offset="0" stop-color="#8E0610"/><stop offset="1" stop-color="#E50914"/></linearGradient>
  <symbol id="mark" viewBox="26 26 50 56">
    <path d="M67.5,36.6 A22,22 0 1,0 67.5,71.4" fill="none" stroke="url(#cgrad)" stroke-width="11"/>
    <path d="M67.5,36.6 A22,22 0 0,0 39.5,41.9" fill="none" stroke="#E50914" stroke-width="11"/>
    <path d="M47,60 a4,4 0 0,1 4,4 L47,64 z" fill="#fff"/><path d="M47,55 a9,9 0 0,1 9,9" fill="none" stroke="#fff" stroke-width="3"/><path d="M47,50 a14,14 0 0,1 14,14" fill="none" stroke="#fff" stroke-width="3"/>
  </symbol></defs></svg>
<div class="l">
  <svg width="150" height="168"><use href="#mark"/></svg>
  <div class="title">Ready to cast</div>
  <div class="pill"><span class="dot"></span>Living room TV<span class="st">Connected</span></div>
</div>
<div class="r">
  <h2>Pick a video on your phone</h2>
  <div class="step"><span class="num ok">✓</span><span class="txt done">Connect this TV to Wi-Fi</span></div>
  <div class="step"><span class="num ok">✓</span><span class="txt done">Open Castify on your phone, tap <svg viewBox="0 0 24 24" width="1.15em" height="1.15em" fill="currentColor" style="vertical-align:-0.2em"><path d="M21 3H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11z"/></svg> and pick Living room TV</span></div>
  <div class="step"><span class="num">3</span><span class="txt">Find a video, tap “Videos found”<small>Once the video plays, you can lock your phone and enjoy</small></span></div>
</div>
</body>
</html>
